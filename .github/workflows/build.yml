name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libqt6sql6-sqlite libspdlog-dev libsqlite3-dev zlib1g-dev libgl1-mesa-dev
      - name: Configure
        run: cmake --preset linux-dev
      - name: Build
        run: cmake --build --preset linux-dev
      - name: Test
        run: ctest --preset linux-dev

  windows:
    name: Windows (MSVC, Qt 6)
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          cache: true
      - name: Locate vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-msvc *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content configure.log -Tail 40 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
      - name: Build
        shell: pwsh
        run: |
          # Run the build with a watchdog: if it stalls, report which compiler/linker
          # commands are still running instead of hanging until the job times out.
          $p = Start-Process -FilePath cmake -ArgumentList '--build','--preset','windows-msvc' -NoNewWindow -PassThru `
                 -RedirectStandardOutput build.log -RedirectStandardError build-err.log
          $null = $p.Handle
          if (-not $p.WaitForExit(30 * 60 * 1000)) {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'cl.exe','link.exe','moc.exe','ninja.exe' } |
              ForEach-Object { Write-Output "::error::Still running after 30 min: $($_.Name) $($_.CommandLine)" }
            Get-Content build.log -Tail 15 | ForEach-Object { Write-Output "::error::$_" }
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Get-Content build.log
          if ($p.ExitCode -ne 0) {
            Select-String -Path build.log,build-err.log -Pattern 'error' | Select-Object -First 40 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
      - name: Test
        run: ctest --preset windows-msvc --timeout 600
      - name: Package
        shell: pwsh
        run: |
          $out = "package/Fallout4MultiplexerRenewed"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/windows-msvc/src/gui/Fallout4MultiplexerRenewed.exe $out
          Copy-Item build/windows-msvc/src/cli/fo4mx.exe $out
          Copy-Item build/windows-msvc/vcpkg_installed/x64-windows/bin/*.dll $out
          windeployqt --release --no-translations --sql $out/Fallout4MultiplexerRenewed.exe
          Copy-Item README.md, docs -Destination $out -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Fallout4MultiplexerRenewed-windows-x64
          path: package/Fallout4MultiplexerRenewed

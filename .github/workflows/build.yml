name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libqt6sql6-sqlite libspdlog-dev libsqlite3-dev zlib1g-dev libgl1-mesa-dev
      - name: Configure
        run: cmake --preset linux-dev
      - name: Build
        run: cmake --build --preset linux-dev
      - name: Test
        run: ctest --preset linux-dev

  windows:
    name: Windows (MSVC, Qt 6)
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          cache: true
      - name: Locate vcpkg
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_COMMIT=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" >> $env:GITHUB_ENV
          # vcpkg's built packages and source downloads are kept between runs (actions/cache below): without
          # them every run rebuilds fmt and spdlog, downloading their patches from github.com/<repo>/commit/
          # <sha>.patch, which GitHub answers with 503 to shared runners for hours at a time.
          $cache = "$env:GITHUB_WORKSPACE\vcpkg-cache"
          New-Item -ItemType Directory -Force -Path "$cache\binary", "$cache\downloads" | Out-Null
          echo "VCPKG_BINARY_CACHE_DIR=$cache\binary" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,$cache\binary,readwrite" >> $env:GITHUB_ENV
          echo "VCPKG_DOWNLOADS=$cache\downloads" >> $env:GITHUB_ENV
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-${{ env.VCPKG_COMMIT }}-
            vcpkg-windows-
      - name: Configure
        shell: pwsh
        run: |
          # A download that fails for a moment (GitHub 503) is tried again; vcpkg keeps what it already
          # built, so a retry continues where it stopped.
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            cmake --preset windows-msvc *>&1 | Tee-Object -FilePath configure.log
            if ($LASTEXITCODE -eq 0) { break }
            $transient = Select-String -Path configure.log -Pattern 'response code 5\d\d|Download failed' -Quiet
            if (-not $transient -or $attempt -eq 4) {
              Get-Content configure.log -Tail 40 | ForEach-Object { Write-Output "::error::$_" }
              exit 1
            }
            Write-Output "::warning::Configure attempt $attempt failed on a download; trying again in $(60 * $attempt) s"
            Start-Sleep -Seconds (60 * $attempt)
          }
      - name: Save vcpkg cache
        # Saved once configure succeeded, even if a later step fails, so the next run downloads nothing.
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
      - name: Build
        shell: pwsh
        run: |
          # Run the build with a watchdog: if it stalls, report which compiler/linker
          # commands are still running instead of hanging until the job times out.
          $p = Start-Process -FilePath cmake -ArgumentList '--build','--preset','windows-msvc' -NoNewWindow -PassThru `
                 -RedirectStandardOutput build.log -RedirectStandardError build-err.log
          $null = $p.Handle
          if (-not $p.WaitForExit(30 * 60 * 1000)) {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'cl.exe','link.exe','moc.exe','ninja.exe' } |
              ForEach-Object { Write-Output "::error::Still running after 30 min: $($_.Name) $($_.CommandLine)" }
            Get-Content build.log -Tail 15 | ForEach-Object { Write-Output "::error::$_" }
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Get-Content build.log
          if ($p.ExitCode -ne 0) {
            Select-String -Path build.log,build-err.log -Pattern 'error' | Select-Object -First 40 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
      - name: Test
        run: ctest --preset windows-msvc --timeout 600
      - name: Package
        shell: pwsh
        run: |
          $out = "package/Fallout4MultiplexerRenewed"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/windows-msvc/src/gui/Fallout4MultiplexerRenewed.exe $out
          Copy-Item build/windows-msvc/src/cli/fo4mx.exe $out
          # The optional Diagnostic Recorder (F4SE plugin): Multiplexer copies it into the output on export.
          Copy-Item build/windows-msvc/src/recorder/MultiplexerDiagnosticRecorder.dll $out
          # The F4SE archive loader: Multiplexer ships it in the package when the setting is on.
          Copy-Item build/windows-msvc/src/archiveloader/MultiplexerArchiveLoader.dll $out
          # Editor IDs of the base-game masters, for the Definition Check's cross-check (optional).
          Copy-Item resources/Fallout4_reference_editorids.bin $out
          Copy-Item build/windows-msvc/vcpkg_installed/x64-windows/bin/*.dll $out
          windeployqt --release --no-translations --sql $out/Fallout4MultiplexerRenewed.exe
          Copy-Item README.md, docs -Destination $out -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Fallout4MultiplexerRenewed-windows-x64
          path: package/Fallout4MultiplexerRenewed

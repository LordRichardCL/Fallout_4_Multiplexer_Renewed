name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # a version tag also publishes a pre-release with the Windows package
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-24.04
    env:
      # Compiler cache: an object is reused only when the preprocessed source, the compiler and its flags
      # are identical (sccache's key), so a changed header recompiles everything that includes it. Stored in
      # the GitHub Actions cache; a cache error is a miss (it compiles), never a failure.
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libqt6sql6-sqlite libspdlog-dev libsqlite3-dev zlib1g-dev libgl1-mesa-dev
      - name: Configure
        run: cmake --preset linux-dev
      - name: Build
        run: cmake --build --preset linux-dev
      - name: Test
        run: ctest --preset linux-dev

  windows:
    name: Windows (MSVC, Qt 6)
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: write # the release step on version tags
    env:
      # Compiler cache (see the Linux job). Release builds use no /Zi, which sccache cannot cache.
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      # aqtinstall wants Python 3.14 or newer; left to choose, install-qt-action takes the newest (3.15), for
      # which py7zr's compression modules have no Windows wheels, so they were built from source on every run
      # (about 40 s) before the cached Qt was even restored. 3.14 has the wheels.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          cache: true
          setup-python: false
      - name: Locate vcpkg
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_COMMIT=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" >> $env:GITHUB_ENV
          # vcpkg's built packages and source downloads are kept between runs (actions/cache below): without
          # them every run rebuilds fmt and spdlog, downloading their patches from github.com/<repo>/commit/
          # <sha>.patch, which GitHub answers with 503 to shared runners for hours at a time.
          $cache = "$env:GITHUB_WORKSPACE\vcpkg-cache"
          New-Item -ItemType Directory -Force -Path "$cache\binary", "$cache\downloads" | Out-Null
          echo "VCPKG_BINARY_CACHE_DIR=$cache\binary" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,$cache\binary,readwrite" >> $env:GITHUB_ENV
          echo "VCPKG_DOWNLOADS=$cache\downloads" >> $env:GITHUB_ENV
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-${{ env.VCPKG_COMMIT }}-
            vcpkg-windows-
      - name: Configure
        shell: pwsh
        run: |
          # A download that fails for a moment (GitHub 503) is tried again; vcpkg keeps what it already
          # built, so a retry continues where it stopped.
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            cmake --preset windows-msvc *>&1 | Tee-Object -FilePath configure.log
            if ($LASTEXITCODE -eq 0) { break }
            $transient = Select-String -Path configure.log -Pattern 'response code 5\d\d|Download failed' -Quiet
            if (-not $transient -or $attempt -eq 4) {
              Get-Content configure.log -Tail 40 | ForEach-Object { Write-Output "::error::$_" }
              exit 1
            }
            Write-Output "::warning::Configure attempt $attempt failed on a download; trying again in $(60 * $attempt) s"
            Start-Sleep -Seconds (60 * $attempt)
          }
      - name: Save vcpkg cache
        # Saved once configure succeeded, even if a later step fails, so the next run downloads nothing.
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
      - name: Build
        shell: pwsh
        run: |
          # Run the build with a watchdog: if it stalls, report which compiler/linker
          # commands are still running instead of hanging until the job times out.
          $p = Start-Process -FilePath cmake -ArgumentList '--build','--preset','windows-msvc' -NoNewWindow -PassThru `
                 -RedirectStandardOutput build.log -RedirectStandardError build-err.log
          $null = $p.Handle
          if (-not $p.WaitForExit(30 * 60 * 1000)) {
            Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'cl.exe','link.exe','moc.exe','ninja.exe' } |
              ForEach-Object { Write-Output "::error::Still running after 30 min: $($_.Name) $($_.CommandLine)" }
            Get-Content build.log -Tail 15 | ForEach-Object { Write-Output "::error::$_" }
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Get-Content build.log
          if ($p.ExitCode -ne 0) {
            Select-String -Path build.log,build-err.log -Pattern 'error' | Select-Object -First 40 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
      - name: Test
        run: ctest --preset windows-msvc --timeout 600
      - name: Package
        shell: pwsh
        run: |
          $out = "package/Fallout4MultiplexerRenewed"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/windows-msvc/src/gui/Fallout4MultiplexerRenewed.exe $out
          Copy-Item build/windows-msvc/src/cli/fo4mx.exe $out
          # The optional Diagnostic Recorder (F4SE plugin): Multiplexer copies it into the output on export.
          Copy-Item build/windows-msvc/src/recorder/MultiplexerDiagnosticRecorder.dll $out
          # The F4SE archive loader: Multiplexer ships it in the package when the setting is on.
          Copy-Item build/windows-msvc/src/archiveloader/MultiplexerArchiveLoader.dll $out
          # Editor IDs of the base-game masters, for the Definition Check's cross-check (optional).
          Copy-Item resources/Fallout4_reference_editorids.bin $out
          Copy-Item build/windows-msvc/vcpkg_installed/x64-windows/bin/*.dll $out
          # Only what the app uses: Qt Widgets drawn in software (no OpenGL, Direct3D or shader compilers) and
          # SQLite. The Visual C++ runtime ships as its three DLLs beside the exe instead of the 25 MB installer.
          windeployqt --release --no-translations --sql --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler $out/Fallout4MultiplexerRenewed.exe
          Remove-Item -ErrorAction SilentlyContinue -Path $out/dxcompiler.dll, $out/dxil.dll, $out/d3dcompiler_47.dll, $out/opengl32sw.dll, $out/vc_redist*.exe
          Remove-Item -ErrorAction SilentlyContinue -Path $out/sqldrivers/qsqlmimer.dll, $out/sqldrivers/qsqlodbc.dll, $out/sqldrivers/qsqlpsql.dll
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { Write-Output "::error::Visual C++ runtime folder not found under $env:VCToolsRedistDir"; exit 1 }
          Copy-Item "$($crt.FullName)/msvcp140.dll", "$($crt.FullName)/vcruntime140.dll", "$($crt.FullName)/vcruntime140_1.dll" $out
          Copy-Item README.md, CHANGELOG.md, docs -Destination $out -Recurse
          $files = Get-ChildItem $out -Recurse -File
          "Package: {0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)
      - name: Smoke test the package
        shell: pwsh
        run: |
          # The package must start on its own: every DLL it needs is in it (a missing one stops the process
          # at once with 0xC0000135). The tests above ran from the build tree, which has more DLLs.
          $out = (Resolve-Path "package/Fallout4MultiplexerRenewed").Path
          & "$out/fo4mx.exe" help > $null
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::fo4mx.exe from the package exited with $LASTEXITCODE"; exit 1 }
          $p = Start-Process -FilePath "$out/Fallout4MultiplexerRenewed.exe" -WorkingDirectory $out -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Output ("::error::The app from the package exited at start with 0x{0:X8}" -f $p.ExitCode); exit 1 }
          Stop-Process -Id $p.Id -Force
          "The packaged app started and kept running."
      - uses: actions/upload-artifact@v4
        with:
          name: Fallout4MultiplexerRenewed-windows-x64
          path: package/Fallout4MultiplexerRenewed
      - name: Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "Fallout4MultiplexerRenewed-$tag-windows-x64.zip"
          Compress-Archive -Path package/Fallout4MultiplexerRenewed/* -DestinationPath $zip
          # The tag's section of CHANGELOG.md is the release text.
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "*$($tag.TrimStart('v'))*" } | Select-Object -First 1
          if (-not $notes) { $notes = "See CHANGELOG.md." }
          Set-Content -Path release-notes.md -Value ("## " + $notes)
          # A release made by hand on GitHub (which creates the tag) gets the package attached; its text is kept.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --prerelease --title "Fallout 4 Multiplexer Renewed $tag" --notes-file release-notes.md
          }
